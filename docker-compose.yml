# Nama project tetap, supaya container/volume tidak bentrok dengan project lain
# yang kebetulan juga berada di folder bernama "server".
name: doexam

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doexam
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: doexam
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doexam"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache konten soal (opsional; tanpa Redis server memakai cache in-memory).
  # Konten soal tidak pernah berubah, jadi tidak perlu persistensi: cukup LRU di memori.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # one-shot: applies the embedded migrations, then the api starts
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://doexam:secret@postgres:5432/doexam?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "127.0.0.1:9464:9464"
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://doexam:secret@postgres:5432/doexam?sslmode=disable
      OTEL_SERVICE_NAME: doexam-api
      STORAGE_DIR: /app/data/storage
      REDIS_URL: redis://redis:6379/0
      # /metrics untuk Prometheus; di-publish hanya ke 127.0.0.1 (lihat MONITORING.md)
      METRICS_ADDR: 0.0.0.0:9464
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - storage:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Monitoring (MONITORING.md) ──────────────────────────────
  # Prometheus scrape /metrics API di host.docker.internal:9464: berlaku untuk service
  # "api" di atas (port di-publish) maupun binary yang dijalankan langsung di host.
  # Token scrape: `openssl rand -hex 16 > monitoring/.metrics-token` (sekali), lalu
  # jalankan API dengan METRICS_TOKEN=$(cat monitoring/.metrics-token).
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop sudah punya
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./monitoring/.metrics-token:/run/secrets/metrics-token:ro
      - prometheus-data:/prometheus

  # Dashboard "DoExam API" sudah terpasang: http://localhost:3000
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Hanya dibuka di 127.0.0.1: penonton tanpa login boleh melihat dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/doexam-api.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  storage:
  prometheus-data:
  grafana-data:
