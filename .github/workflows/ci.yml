name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  integration:
    name: Integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doexam
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: doexam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doexam" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://doexam:secret@localhost:5432/doexam?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Migrations up, down, up (embedded)
        run: |
          go build -o /tmp/doexam ./app/server
          /tmp/doexam migrate up
          /tmp/doexam migrate version
          /tmp/doexam migrate down 1000
          /tmp/doexam migrate up
      - run: go test -tags integration -count=1 ./...

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: doexam-server:ci
          build-args: VERSION=${{ github.sha }}
